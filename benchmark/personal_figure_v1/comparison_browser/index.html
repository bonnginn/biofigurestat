<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Figure Validation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">LSA PERSONAL WORKFLOW VALIDATION</p>
        <h1>Published Figure Comparison</h1>
      </div>
      <div class="progress">
        <strong id="progressText">0 / 0</strong><span id="saveState">未保存</span>
      </div>
    </header>
    <div class="layout">
      <aside>
        <nav id="caseList" aria-label="ケース一覧"></nav>
      </aside>
      <main>
        <section class="case-head">
          <div>
            <p id="caseMeta" class="eyebrow"></p>
            <h2 id="caseTitle"></h2>
            <p id="caseNote"></p>
          </div>
          <div class="pager"><button id="prev">← 前</button><button id="next">次 →</button></div>
        </section>
        <section class="figures" aria-label="Figure comparison">
          <article>
            <div class="panel-label">REFERENCE</div>
            <div class="image-frame"><img id="referenceImage" alt="Published reference" /></div>
          </article>
          <article>
            <div class="panel-label">DEFAULT</div>
            <div class="image-frame"><img id="defaultImage" alt="App default graph" /></div>
          </article>
          <article>
            <div class="panel-label">FINAL</div>
            <div class="image-frame"><img id="finalImage" alt="App final graph" /></div>
            <p id="finalFallback" class="fallback"></p>
          </article>
        </section>
        <section class="method-comparison" aria-label="Method comparison">
          <article>
            <div class="method-heading"><span>GRAPH</span><strong>グラフ形式</strong></div>
            <dl>
              <div>
                <dt>論文</dt>
                <dd id="paperGraph"></dd>
              </div>
              <div>
                <dt>アプリ</dt>
                <dd id="appGraph"></dd>
              </div>
            </dl>
            <p id="graphChangeReason" class="change-reason"></p>
          </article>
          <article>
            <div class="method-heading"><span>STATISTICS</span><strong>統計手法</strong></div>
            <dl>
              <div>
                <dt>論文</dt>
                <dd id="paperStatistics"></dd>
              </div>
              <div>
                <dt>アプリ</dt>
                <dd id="appStatistics"></dd>
              </div>
            </dl>
            <p id="statisticsChangeReason" class="change-reason"></p>
          </article>
        </section>
        <section class="review-card">
          <div class="field">
            <span>Readability</span>
            <div id="readability" class="segmented" data-field="readability"></div>
          </div>
          <div class="field">
            <span>Preference</span>
            <div id="preference" class="segmented" data-field="preference"></div>
          </div>
          <div class="field flags">
            <span>Flags</span><label><input type="checkbox" value="labels" />Labels</label
            ><label><input type="checkbox" value="scale" />Scale</label
            ><label><input type="checkbox" value="statistics" />Statistics</label
            ><label><input type="checkbox" value="structure" />Structure</label>
          </div>
          <label class="comment"
            ><span>Comment</span
            ><textarea id="comment" rows="3" placeholder="このFigureで気づいたこと"></textarea>
          </label>
          <div class="actions">
            <a id="methodsLink" target="_blank">Methods</a
            ><a id="statisticsLink" target="_blank">Statistics JSON</a
            ><button id="save" class="primary">レビューを保存</button
            ><button id="export">JSONを書き出す</button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
