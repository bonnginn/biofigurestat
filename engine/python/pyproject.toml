[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lsaa-analysis-engine"
version = "0.7.0"
description = "Pinned local statistical engine for Life Science Analysis App"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.18.0",
  "statsmodels==0.14.6",
]

[project.optional-dependencies]
packaging = [
  "pyinstaller==6.21.0",
]

[tool.setuptools]
packages = ["lsaa_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
